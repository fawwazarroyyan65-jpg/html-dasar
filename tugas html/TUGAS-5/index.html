<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

<body>
    <div class="card">
        <h1> alert info </h1>
        <hr>
        <div class="alert">
            <p>ℹ️ Info: Pastikan data Anda sudah lengkap sebelum dikirim.</p>

        </div>
    </div>
    <br>
    <div class="card">
        <h1>profile card </h1>
        <hr>
        <div class=" card avatar">
            <img src="assets/33bac083ba44f180c1435fc41975bf36-ca73ec342155d955387493c4eb78c8bb.avif" alt="User Photo" />

            <h3>Andika Putra</h3>
           <p>Frontend Developer</p>

    </div>
    <br>
    <div class="pricing">
  <h1>pricing card</h1>
<hr/>

  </div>

  <div class="plan highlight">

    <button>Pilih Paket</button>
  </div>

  <div class="plan">

    <button>Pilih Paket</button>

</div>
